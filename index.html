<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="theme-color" content="#f7f5f1">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Overload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, bright and confident: a training app you're proud to show a friend
   IDEA a rack of competition bumper plates, each colour a training day
   PICTURE photoreal face-on bumper plates for the week, and one big plate that fills as you finish sets
   COLOUR warm white ground with soft colour light, competition red, blue, yellow and green, ink near-black
   TYPE Archivo 800 for titles and numbers + Inter text
   LAYOUT one app column: header, week rack, colour hero for the day, white exercise cards, floating rest pill, tab bar */
:root{color-scheme:light;--bg:#f7f5f1;--ink:#14161c;--mute:#6b7080;--line:#e7e7ec;--card:rgba(255,255,255,.78);--soft:#f2f3f6;--red:#ef2b36;--blue:#2563ff;--yellow:#ffbe0b;--green:#16b65b;--purple:#7c4dff;--black:#23252b;--accent:var(--red);--shadow:0 12px 32px -20px rgba(20,22,40,.35),0 2px 6px -2px rgba(20,22,40,.06)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.bgx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 0% 0%,rgba(239,43,54,.20),transparent 70%),radial-gradient(55% 40% at 100% 8%,rgba(37,99,255,.18),transparent 70%),radial-gradient(70% 45% at 85% 100%,rgba(255,190,11,.20),transparent 70%),radial-gradient(50% 35% at 0% 85%,rgba(22,182,91,.14),transparent 70%),var(--bg)}
.art{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{flex:1;width:100%;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.num,.wm{font-family:Archivo,Inter,sans-serif;letter-spacing:-.02em;line-height:1.02;margin:0}
h1{font-size:clamp(40px,11vw,60px);font-weight:900}
h2{font-size:32px;font-weight:900}
h3{font-size:20px;font-weight:800}
.num{font-weight:900;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.wm{font-size:26px;font-weight:900;display:flex;align-items:center;gap:8px}
.wm svg{width:30px;height:30px}
.hi{font-size:14px;color:var(--mute);margin-top:2px}
input,select,button,textarea{font:inherit;font-size:16px;color:var(--ink)}
.field,select,textarea{background:var(--soft);border:1.5px solid transparent;border-radius:14px;min-height:48px;padding:0 14px;width:100%}
textarea{padding:12px 14px;min-height:90px;resize:vertical}
.field:focus,select:focus,textarea:focus,.srow input:focus{outline:none;border-color:var(--accent);background:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;border:0;background:var(--soft);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn.go{background:var(--ink);color:#fff}
.btn.acc{background:var(--accent);color:#fff;box-shadow:0 10px 22px -12px var(--accent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.btn.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.btn.white{background:#fff;color:#14161c;font-weight:800}.btn.white:active{background:#eceef2}
.iconb{width:44px;padding:0;background:var(--card);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.rack{padding:12px 10px 10px}
.rackh{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px}
.rackh b{font:800 16px Archivo,sans-serif}
.rackh .nav{display:flex;gap:6px}
.rackh .nav button{width:36px;height:36px;border-radius:11px;border:0;background:var(--soft);cursor:pointer;font-weight:800;font-size:18px;color:var(--ink)}
.rackh .nav .today{width:auto;padding:0 12px;font-size:13px}
.plates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.pday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:16px;border:0;background:none;cursor:pointer;transition:background .2s}
.pday svg{width:100%;max-width:58px;aspect-ratio:1;filter:drop-shadow(0 6px 6px rgba(20,22,40,.22))}
.pday .d{font-size:12px;font-weight:700;color:var(--mute)}
.pday .dn{font:800 15px Archivo,sans-serif}
.pday.sel{background:var(--soft)}
.pday.sel .dn{color:var(--accent)}
.pday.now .d{color:var(--accent)}
.hero{position:relative;border-radius:28px;padding:20px 18px 18px;margin-bottom:14px;color:#fff;overflow:hidden;box-shadow:0 22px 44px -24px var(--accent);background:var(--grad)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,rgba(255,255,255,.28),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(0,0,0,.18),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.kick{font-size:14px;font-weight:600;opacity:.9}
.hero h1{margin:4px 0 6px}
.bigplate{width:124px;height:124px;pointer-events:none}
.bigplate svg{width:100%;height:100%;filter:drop-shadow(0 14px 16px rgba(0,0,0,.35))}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.hs{background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px)}
.hs .num{font-size:24px}
.hs span{font-size:12px;font-weight:600;opacity:.9}
.hact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ghd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.glbl{font-size:13px;font-weight:800;color:var(--mute);letter-spacing:.01em}
.ex+.ex{border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
.exh{display:flex;align-items:center;gap:10px}
.badge{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:900 14px Archivo,sans-serif;color:#fff;background:var(--accent)}
.exh h3{flex:1}
.tgt{font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.meta{font-size:13px;color:var(--mute);margin:8px 0 8px}
.meta b{color:var(--ink);font-weight:700}
.cue{display:inline-block;background:#fff6da;color:#7a5a00;font-size:13px;font-weight:600;border-radius:10px;padding:4px 10px;margin-bottom:8px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;margin:0 6px 8px 0}
.tag.up{background:#e3f7ec;color:#0f8a45}
.tag.pr{background:#ffe5e7;color:#d1121f}
.shead,.srow{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.shead{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-align:center}
.shead span:first-child{text-align:left}
.srow{margin-bottom:8px}
.srow .n{font:900 18px Archivo,sans-serif;color:#b3b6c2;text-align:center}
.srow .n em{font-style:normal;color:var(--green);font-size:13px}
.srow input{width:100%;height:50px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);text-align:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;transition:background .2s}
.srow input::placeholder{color:#b4b7c2;font-weight:700}
.ck{height:50px;border-radius:14px;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.ck svg{width:24px;height:24px;color:#b4b7c2}
.ck:active{transform:scale(.92)}
.srow.done input{background:#e8f8ef;color:#0b6b35}
.srow.done .ck{background:var(--green);box-shadow:0 8px 16px -10px var(--green)}
.srow.done .ck svg{color:#fff}
.srow.done .n{color:var(--green)}
.xbtn{flex:none;height:34px;min-width:34px;padding:0 8px;border-radius:10px;border:0;background:var(--soft);color:var(--mute);cursor:pointer;display:grid;place-items:center;font-weight:800;font-size:13px}
.xbtn.on{background:#ffe1e3;color:#d1121f}
.exnote{width:100%;min-height:40px;height:40px;margin:2px 0 8px;padding:9px 12px;border-radius:12px;border:1.5px solid transparent;background:var(--soft);font-size:14px;resize:none;overflow:hidden;line-height:1.4}
.exnote:focus{outline:none;border-color:var(--accent);background:#fff}
.lnote{font-size:13px;color:#3b4252;background:#eef2ff;border-radius:10px;padding:5px 10px;margin-bottom:8px}
.hname{display:flex;align-items:center;gap:10px}
.ren{flex:none;width:36px;height:36px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:18px;cursor:pointer}
.rn{margin:6px 0;font:900 28px Archivo,sans-serif;background:rgba(255,255,255,.95)!important;color:var(--ink)}
.bkb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#fff,#eef2ff)}
.exfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.empty{text-align:center;color:var(--mute);padding:26px 14px}
.empty h3{color:var(--ink);margin-bottom:6px}
.sum{background:linear-gradient(135deg,#16b65b,#00c2a8);color:#fff}
.sum .sub{color:rgba(255,255,255,.9)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.tile{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sum .tile{background:rgba(255,255,255,.2);box-shadow:none;border:0}
.tile .num{font-size:30px}
.tile .sub{font-size:13px}
@media(min-width:560px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dock{position:sticky;bottom:0;z-index:5;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(247,245,241,0),rgba(247,245,241,.92) 30%)}
.rest{display:none;align-items:center;gap:10px;max-width:700px;margin:0 auto 8px;padding:8px 8px 8px 10px;border-radius:22px;background:var(--ink);color:#fff;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.rest.on{display:flex}
.ring{width:48px;height:48px;flex:none}
.rest .num{font-size:30px;min-width:2.4em}
.rest .lbl{flex:1;font-size:12px;color:#aeb2bd;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .lbl b{display:block;color:#fff;font-size:14px}
.rest .rb{min-height:38px;min-width:42px;padding:0 10px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.rest.done{background:var(--green)}
@media(max-width:440px){#rminus{display:none}.rest .num{font-size:26px;min-width:2.2em}.ring{width:42px;height:42px}.rest .rb{min-width:38px;padding:0 8px}}
.rest.done .lbl{color:#eafff2}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;max-width:700px;margin:0 auto;padding:6px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);box-shadow:0 14px 36px -18px rgba(20,22,40,.45);border:1px solid rgba(20,22,40,.06)}
.tabs button{height:52px;border-radius:18px;border:0;background:none;font-weight:700;font-size:11.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-pressed=true]{color:#fff;background:var(--ink)}
.fig{position:relative;height:230px;margin:8px 0 12px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font:12px Inter,sans-serif;fill:var(--mute)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) 80px 4em;gap:10px;align-items:center;padding:12px 2px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.lift:first-of-type{border-top:0}
.lift b{display:block;font-size:15px}
.lift .num{font-size:22px;text-align:right}
.lift svg{width:80px;height:30px}
.grn{color:var(--green)}.redt{color:var(--red)}
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
.hist td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.mrow{display:grid;grid-template-columns:7em minmax(0,1fr) 3em;gap:10px;align-items:center;margin:10px 0;font-size:14px;font-weight:600}
.mrow .t{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.mrow .t i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;height:140px;margin-top:10px}
.vbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute);font-weight:600}
.vbars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ff6b6b,var(--red));min-height:4px}
.vbars div.cur i{background:linear-gradient(180deg,#5b8cff,var(--blue))}
.heat{display:grid;grid-template-columns:2.8em repeat(7,minmax(0,1fr));gap:5px;font-size:11px;color:var(--mute);align-items:center;max-width:380px;font-weight:600}
.heat i{display:block;aspect-ratio:1;border-radius:6px;background:var(--soft)}
.heat i.td{outline:2px solid var(--ink);outline-offset:-2px}
.prrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prrow .num{font-size:24px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:10px 0}
.seg button{flex:none;min-height:38px;padding:0 14px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
.days button{height:46px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--shadow);font-weight:800;cursor:pointer;font-size:14px;position:relative}
.days button i{position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.days button[aria-pressed=true]{background:var(--ink);color:#fff}
.erow{border-top:1px solid var(--line);padding:14px 0 6px}
.erow:first-of-type{border-top:0;padding-top:6px}
.erow .r1{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.erow .r2{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.nl{display:grid;gap:3px;font-size:11px;font-weight:700;color:var(--mute);text-align:center}
.nl input,.erow input{width:100%;height:44px;border:1.5px solid transparent;border-radius:12px;background:var(--soft);padding:0 10px;text-align:center}
.erow .r1 input{text-align:left;font-weight:800}
.erow .cuein{text-align:left!important;margin-top:6px;font-size:14px}
.erow select{min-height:44px;font-size:14px;padding:0 8px;align-self:end}
.del{background:var(--soft);border:0;border-radius:12px;color:var(--mute);cursor:pointer;height:44px;font-weight:800}
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.colors button[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.pick{border-radius:20px;background:var(--soft);padding:12px;margin-top:10px}
.plist{max-height:310px;overflow-y:auto;margin-top:8px;display:grid;gap:6px}
.plist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;min-height:46px;padding:0 14px;border-radius:12px;border:0;background:#fff;cursor:pointer;font-weight:700}
.plist button span{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.tpl{display:grid;gap:10px;margin:14px 0}
.tpl button{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--card);border:0;border-radius:22px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.tpl b{display:block;font:800 20px Archivo,sans-serif;margin-bottom:2px}
.tpl svg{width:52px;height:52px}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.note{position:relative;border-radius:22px;padding:14px;min-height:124px;cursor:pointer;text-align:left;border:0;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);color:var(--ink)}
.note b{font:800 18px Archivo,sans-serif;line-height:1.1}
.note p{margin:0;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.note .pin{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;opacity:.6}
.c-red{background:#ffe1e3}.c-yellow{background:#fff1c2}.c-blue{background:#dfe8ff}.c-green{background:#d9f6e5}.c-white{background:#fff}
.swatches{display:flex;gap:8px;margin:10px 0}
.swatches button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed=true]{border:3px solid var(--ink)}
.tl{border-top:1px solid var(--line);padding:12px 0}
.tl p{margin:4px 0 0;white-space:pre-wrap}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.tog:first-of-type{border-top:0}
.sw{position:relative;width:52px;height:32px;border-radius:20px;border:0;background:#d7d9e0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-pressed=true]{background:var(--green)}
.sw[aria-pressed=true]::after{left:23px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-240%);visibility:hidden;background:var(--ink);color:#fff;font-weight:800;padding:11px 18px;border-radius:16px;z-index:20;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0);visibility:visible}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mute);font-weight:700}
.hide{display:none!important}
.sec{margin-top:22px}
.obhero{border-radius:28px;padding:24px 20px;color:#fff;background:linear-gradient(135deg,#ff3d4a,#ff7a3d 55%,#ffbe0b);box-shadow:0 22px 44px -24px #ef2b36;position:relative;overflow:hidden}
.obhero svg.deco{position:absolute;right:-30px;bottom:-30px;width:180px;height:180px;opacity:.95}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 2.0: dark mode (neon) ---------- */

/* ---------- 2.0: welcome splash ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);overflow:hidden;transition:opacity .35s,transform .35s}

#splash .sp{position:relative;width:min(56vw,250px);aspect-ratio:1;animation:roll .75s cubic-bezier(.2,.9,.25,1) both}

#splash .sl b{color:var(--ink)}
#splash .lines{position:absolute;inset:0;width:100%;height:100%}
#splash .lines path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s .1s ease-out forwards}
@keyframes roll{from{transform:translateX(-120vw) rotate(-540deg)}to{transform:none}}
@keyframes ringin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){#splash .sp,#splash .sring,#splash .swm,#splash .sl,#splash .lines path{animation:none!important;stroke-dashoffset:0}}

.ja{display:flex;gap:10px;align-items:center;padding:6px 0}.ja>span{font-size:24px;width:36px;text-align:center}
.ptrophy .ptro{display:flex;gap:12px;align-items:center}.ptro>span{font-size:40px}
.roast{font-size:13px;color:var(--mute);font-style:italic;margin:6px 0 0}
.shame{font-size:13px}
/* post card styles + name effects */
.post.pc-carbon{background:repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0 6px,rgba(0,0,0,.0) 6px 12px),var(--card)}
.post.pc-gold{box-shadow:inset 0 0 0 1.5px #e3c25a,var(--shadow)}
.post.pc-ice{box-shadow:inset 0 0 0 1.5px #8fd3ff,var(--shadow);background:linear-gradient(180deg,rgba(143,211,255,.12),var(--card) 40%)}
.post.pc-neon{box-shadow:inset 0 0 0 1.5px #00e5ff,0 0 18px -6px #ff2bd6}
.nf-gold{background:linear-gradient(90deg,#b8860b,#ffe07a,#b8860b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:nfs 3s linear infinite}
.nf-fire{background:linear-gradient(90deg,#ff2d2d,#ffb347,#ff2d2d);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:nfs 2s linear infinite}
.nf-rainbow{background:linear-gradient(90deg,#ff3d4a,#ffbe0b,#16b65b,#2563ff,#d14dff,#ff3d4a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:nfs 4s linear infinite}
.nf-neon{color:#00e5ff!important;text-shadow:0 0 6px rgba(0,229,255,.7)}
@keyframes nfs{to{background-position:200% 0}}
/* chat */
.chat{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 420px);min-height:220px;overflow-y:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mday{text-align:center;font-size:11px;font-weight:800;color:var(--mute);margin:10px 0 4px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:86%}.msg.me{align-self:flex-end;flex-direction:row-reverse}.msg.grp{margin-top:-2px}.msg.grp:not(.me){padding-left:34px}
.mav{flex:none}.mbody{min-width:0}.mname{font-size:12px;font-weight:800;margin:0 0 2px 6px;color:var(--mute)}
.bub{position:relative;background:var(--card);border-radius:18px 18px 18px 6px;padding:8px 34px 8px 12px;box-shadow:var(--shadow);font-size:15px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me .bub{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px}.msg.me .bub .mt{color:rgba(255,255,255,.75)}
.mt{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.mmore{position:absolute;right:6px;top:6px;border:0;background:none;color:inherit;opacity:.55;font-size:16px;padding:2px 4px;line-height:1}
.mention{font-weight:900}.msg.me .mention{color:#fff;text-decoration:underline}.msg:not(.me) .mention{color:var(--accent)}
.mrep{font-size:12px;color:var(--mute);margin:0 0 3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.mrxs{display:flex;gap:4px;margin:3px 0 0 6px;flex-wrap:wrap}.mrx{border:0;border-radius:999px;background:var(--soft);font-size:13px;padding:2px 8px}.mrx.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.msg.del .bub{opacity:.55;font-size:13px}
.mcard{border-left:4px solid var(--pc);background:rgba(0,0,0,.06);border-radius:10px;padding:6px 10px;margin:4px 0;color:var(--ink)}.msg.me .mcard{background:rgba(255,255,255,.92)}
.mct{display:flex;gap:10px;font-size:12px;flex-wrap:wrap}
.chatbar{padding:8px 0 4px}
.cin{display:flex;gap:6px;align-items:center}.cin .field{flex:1;min-height:44px;border-radius:22px}.cin .btn{width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;font-size:20px}
.cplus{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:22px;color:var(--ink)}
.crep{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;background:var(--soft);border-radius:12px;padding:6px 10px;margin-bottom:6px}.crep button{border:0;background:none;color:var(--mute)}
.ment{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}.ment button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.chatempty{text-align:center;padding:30px 10px}
/* trash */
.trow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.trow>span{font-size:22px}.trow>div{flex:1;min-width:0}.trow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* locker */
.lkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.lki{border:0;background:var(--soft);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink)}.lki b{font-size:12px}
.lkp svg{width:56px;height:56px}.lki.lk .lkp{position:relative}.lki.lk .lkp::after{content:'🔒';position:absolute;right:-4px;bottom:-2px;font-size:14px;background:var(--card);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;box-shadow:var(--shadow)}
.lkrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.lkc{border:0;background:var(--soft);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.lkc i{display:block;width:26px;height:26px;border-radius:50%}.lkc .sub{font-size:10px;font-weight:600}.lkc.on{box-shadow:inset 0 0 0 2px var(--accent)}.lkc.lk{opacity:.75}
.lki2 svg{width:36px;height:36px}
.boxcta{display:flex;gap:12px;align-items:center;border:0;width:100%;text-align:left;background:linear-gradient(120deg,#5b2bd6,#ff4fd8);color:#fff}.boxcta .sub{color:rgba(255,255,255,.8)}
.mbox{font-size:34px;animation:mbw 1.6s ease-in-out infinite}@keyframes mbw{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(0)}}
.boxopen{text-align:center;padding:20px 0}.bigbox{font-size:96px;animation:mbw .5s ease-in-out infinite}.bigbox.opened{animation:bpop .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes bpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
/* trophy room */
.troom .shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 4px 10px;margin-bottom:8px;border-bottom:6px solid rgba(160,200,255,.35);border-radius:0 0 6px 6px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(160,200,255,.12));box-shadow:0 8px 14px -10px rgba(0,60,140,.4)}
.tro{border:0;background:none;padding:0;display:grid;place-items:center;perspective:300px}.tro .t3d{display:block;transition:transform .6s}.tro.on .t3d{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.tro:active .t3d{transform:rotateY(180deg)}
.tspin{display:grid;place-items:center;margin:10px 0;perspective:500px}.tspin svg{animation:tspin 3.2s linear infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}.tspin.dim svg{animation-duration:6s}@keyframes tspin{to{transform:rotateY(360deg)}}
/* profile banner */
.pban{margin:-16px -16px 10px;height:96px;border-radius:24px 24px 0 0;overflow:hidden}
/* scene picker */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.scb{border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column;text-align:left}.scb svg{height:56px}.scb span{font-size:11px;font-weight:700;padding:4px 8px;color:var(--ink)}.scb.on{box-shadow:inset 0 0 0 2.5px var(--accent)}.scb.lk svg{filter:grayscale(.6) brightness(.8)}
/* plate picker: locked colors shown in full with a lock badge */
.colors button.locked{opacity:1!important;filter:none!important;position:relative}
.colors button .lkb{position:absolute;right:-3px;bottom:-3px;font-size:10px;font-style:normal;background:var(--card);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.colors button .finb{position:absolute;left:-2px;top:-3px;font-size:10px;font-style:normal;color:#fff;text-shadow:0 0 3px #000}
/* effects */
.sfx{position:fixed;z-index:60;pointer-events:none;width:0;height:0}
.sfx-sparks i,.sfx-pop i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--c,#ffbe0b);animation:sfx1 .7s ease-out forwards;transform:rotate(var(--a)) translateY(0)}@keyframes sfx1{to{transform:rotate(var(--a)) translateY(-46px);opacity:0}}
.sfx-pop i{border-radius:2px;width:7px;height:4px}
.sfx-shock::before{content:'';position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;border:3px solid var(--accent);animation:sfx2 .6s ease-out forwards}@keyframes sfx2{to{transform:scale(5);opacity:0}}
.sfx-lightning svg{position:absolute;left:-13px;top:-60px;animation:sfx3 .6s ease-out forwards}@keyframes sfx3{0%{opacity:0;transform:translateY(-10px)}20%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.prfx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.prfx-fireworks i{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:50%;background:#ffbe0b;box-shadow:0 0 0 0 #ef2b36;animation:fw 1.2s var(--d) ease-out both}@keyframes fw{0%{transform:scale(0);box-shadow:0 0 0 0 rgba(239,43,54,.9)}60%{transform:scale(1);box-shadow:0 0 0 30px rgba(239,43,54,0)}100%{opacity:0}}
.prfx-goldrain i{position:absolute;left:var(--x);top:-20px;width:8px;height:14px;border-radius:3px;background:linear-gradient(#fff3b0,#c99a2e);animation:gr 1.8s var(--d) linear both}@keyframes gr{to{transform:translateY(110vh) rotate(260deg)}}
.prfx-storm{background:rgba(20,22,40,.0);animation:stbg 1.6s}.prfx-storm i{position:absolute;left:var(--x);top:0;width:4px;height:60%;background:linear-gradient(#fff,#b8c4ff);clip-path:polygon(40% 0,100% 0,60% 40%,100% 40%,0 100%,30% 55%,0 55%);animation:sti .5s var(--d) both}@keyframes stbg{0%,100%{background:rgba(20,22,40,0)}20%{background:rgba(20,22,40,.35)}}@keyframes sti{0%,100%{opacity:0}20%,60%{opacity:1}}
/* rest timer skins + jokes */
#rest[data-skin=bar] svg{display:none}#rest[data-skin=bar]{border-radius:16px}
#rest[data-skin=neon] #rnum{color:#00e5ff;text-shadow:0 0 8px rgba(0,229,255,.8)}#rest[data-skin=neon] #ringp{stroke:#ff2bd6}
#rest[data-skin=plate] svg{animation:s-spin 6s linear infinite}
/* tappable plate */
.bigplate{position:relative;cursor:pointer;pointer-events:auto!important}.bigplate.wob svg{animation:wob .6s ease}@keyframes wob{20%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}80%{transform:rotate(-4deg)}}
.pbub{position:absolute;right:20%;top:-6px;z-index:3;background:var(--ink);color:var(--bg);font-size:13px;font-weight:800;border-radius:14px;padding:6px 10px;white-space:nowrap;animation:pbub 2.2s ease both;pointer-events:none}.pbub::after{content:'';position:absolute;left:60%;bottom:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}@keyframes pbub{0%{opacity:0;transform:translateY(6px) scale(.9)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
/* excuse */
.excuse{font:900 24px/1.25 Archivo,sans-serif;text-align:center;margin:18px 6px 16px}
.excl{border:0;background:none;color:var(--mute);font-weight:700;font-size:13px;text-decoration:underline;margin-top:8px}
/* backgrounds */
body[data-bg=minimal] .art{display:none}
body[data-bg=grid] .art{display:none}body[data-bg=grid]{background-image:linear-gradient(rgba(37,99,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,255,.07) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
body[data-bg=stars] .art{display:none}body[data-bg=stars]{background-image:radial-gradient(1.2px 1.2px at 20% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 70% 80%,rgba(255,255,255,.6),transparent),radial-gradient(1.4px 1.4px at 40% 70%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 85% 20%,rgba(255,255,255,.7),transparent);background-size:180px 180px;background-attachment:fixed}
html:not([data-mode=dark]) body[data-bg=stars]{background-color:#101224}
/* welcome variants */
#splash .wfx{position:absolute;inset:0;pointer-events:none}
#splash .wfx-lightning path{animation:s-flash 1.4s .2s both}
#splash .wfx-forge i{position:absolute;bottom:20%;left:var(--x);width:4px;height:4px;border-radius:50%;background:#ffb347;animation:s-rise 1.4s var(--d) linear infinite}
#splash .wfx-galaxy{background:radial-gradient(circle at 50% 45%,rgba(91,43,214,.5),transparent 60%)}#splash .wfx-galaxy i{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;border-radius:50%;background:#fff;animation:s-tw 1.4s var(--d) infinite}
/* evolving badge art */
.bdg.on.ev2 .bi{box-shadow:0 0 0 2px #c98a4a;border-radius:50%}
.bdg.on.ev3 .bi{box-shadow:0 0 0 2px #cfd4dc,0 0 0 4px rgba(207,212,220,.4);border-radius:50%}
.bdg.on.ev4 .bi{box-shadow:0 0 0 2px #e3c25a,0 0 12px rgba(227,194,90,.6);border-radius:50%}
.bdg.on.ev5 .bi{box-shadow:0 0 0 2px #7ab8ff,0 0 14px rgba(122,184,255,.7);border-radius:50%;animation:evg 2.4s ease-in-out infinite}
.bdg.on.ev6 .bi{box-shadow:0 0 0 2px #ff7a1f,0 0 16px rgba(255,90,31,.8);border-radius:50%;animation:evg 1.6s ease-in-out infinite}
@keyframes evg{50%{filter:brightness(1.25)}}
.crest-glow{filter:drop-shadow(0 0 8px rgba(255,215,106,.8))}

.hero .excl{color:rgba(255,255,255,.9)}

.boxcta .stx{display:flex;flex-direction:column;gap:2px}

.rjoke{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px}

/* ===== Redesign: Overload Pro look ===== */
:root{--bg:#f4f4f6;--ink:#0d0d10;--mute:#6c6c74;--line:rgba(0,0,0,.08);--card:#ffffff;--soft:#efeff2;--accent:#e5352b;--red:#e5352b;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -16px rgba(0,0,0,.18);--rad:18px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;--dfont:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
html[data-mode=dark]{--bg:#09090b;--ink:#f4f4f5;--mute:#8b8b93;--line:rgba(255,255,255,.08);--card:#141416;--soft:#1c1c1f;--shadow:none}
html body{font:16px/1.45 var(--font);letter-spacing:-.005em;background:var(--bg);-webkit-font-smoothing:antialiased}
html body #art,html body .art{display:none!important}
html body h1,html body h2,html body h3,html body .num,html body .wm{font-family:var(--dfont);letter-spacing:-.025em}
html body h1{font-size:clamp(34px,9vw,44px);font-weight:700}
html body h2{font-size:26px;font-weight:700}
html body h3{font-size:17px;font-weight:600}
html body .num{font-weight:700;font-variant-numeric:tabular-nums}
html body .wm{font-size:22px;font-weight:700;gap:9px}.wm svg{width:26px;height:26px}
html body .sub{color:var(--mute)}
html body .glbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
/* surfaces */
html body .card,html body .post{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none;padding:16px}
html body .tile{background:var(--soft);border:0;box-shadow:none;border-radius:14px;-webkit-backdrop-filter:none;backdrop-filter:none}
html body .sheet{background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
html body .sheetbg{background:rgba(0,0,0,.42);-webkit-backdrop-filter:none;backdrop-filter:none}
/* buttons and inputs */
html body .btn{border-radius:12px;min-height:44px;font-weight:600;font-size:15px;background:var(--soft);color:var(--ink);box-shadow:none;letter-spacing:-.01em}
html body .btn.acc,html body .acc{background:var(--accent);color:#fff;box-shadow:none}
html body .btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
html body .btn.go{background:var(--ink);color:var(--bg)}
html body .btn:active{transform:scale(.98);opacity:.9}
html body .field,html body input,html body select,html body textarea{font-family:var(--font)}
html body .field{background:var(--soft);border:1px solid transparent;border-radius:12px}
html body .field:focus{border-color:var(--accent);outline:none}
/* segmented controls */
html body .seg2{background:var(--soft);border-radius:11px;padding:3px;gap:2px}
html body .seg2 button{border-radius:9px;font-weight:600;font-size:13.5px;padding:7px 6px;color:var(--mute)}
html body .seg2 button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
html[data-mode=dark] body .seg2 button[aria-pressed=true]{background:#2a2a2e}
html body .seg button{background:var(--soft);box-shadow:none;border-radius:10px;font-weight:600}
html body .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* tab bar */
html body .dock{background:linear-gradient(180deg,transparent,var(--bg) 35%)}
html body .tabs{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.4);padding:4px;-webkit-backdrop-filter:none;backdrop-filter:none}
html body .tabs button{height:50px;border-radius:16px;font-weight:600;font-size:10.5px;color:var(--mute);gap:4px;background:none;box-shadow:none}
html body .tabs svg{width:22px;height:22px;stroke-width:1.8}
html body .tabs button[aria-pressed=true]{color:var(--accent);background:none;box-shadow:none}
html body .tabs button[aria-pressed=true] svg{stroke-width:2.2}
/* header */
html body .iconb{background:var(--card);border:1px solid var(--line);box-shadow:none}
/* hero (Today card): calm surface with a plate-color accent instead of a full gradient */
html body .hero{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px}
html body .hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
html body .hero .sub,html body .hero .tile .sub{color:var(--mute)}
html body .hero .tile{background:var(--soft)}
html body .hero .num{color:var(--ink)}
html body .hero .btn,html body .hero button.btn{background:var(--ink);color:var(--bg)}
html body .hero h1{color:var(--ink)}
/* exercise blocks */
html body .badge{border-radius:9px;font:700 13px var(--dfont);width:30px;height:30px}
html body .ex{border-top:1px solid var(--line)}
html body .exh h3{font-size:18px}
html body .tgt{color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.eximg{height:0;padding-top:52%;border-radius:14px;background:var(--soft) center/cover no-repeat;margin:4px 0 12px;position:relative;overflow:hidden}
.eximg.has::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45))}
.eximg span{position:absolute;left:12px;bottom:10px;z-index:1;color:#fff;font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase}
/* icons */
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.bi .ico,.ti2 .ico,.slot .ico,.si .ico,.bi2 .ico,.fe .ico,.cbig .ico,.chi .ico,.pemb .ico{width:28px;height:28px}
.cbig .ico{width:64px;height:64px}
html body .bdg .bi{color:var(--ink);filter:none}
html body .bdg:not(.on) .bi{color:var(--mute)}
html body .bdg{background:var(--soft);box-shadow:none;border-radius:14px}
html body .bdg.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
html body .bdg.lad.on{box-shadow:inset 0 0 0 1.5px var(--tc)}
html body .bdg.shine::after{opacity:.5}
/* chips, toasts, rows */
html body #toast{background:var(--ink);color:var(--bg);border-radius:12px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
html body .rchip{font-weight:600}
html body .ptag{background:var(--soft);color:var(--ink);font-weight:600}
html body .crewban{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
html body .crewban::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--b1),var(--b2))}
html body .crewban h2{color:var(--ink)}
html body .crewban .cbs{color:var(--mute)}
html body .crewban .bell{background:var(--soft);color:var(--ink)}

function plistHTML(q){const ql=q.trim().toLowerCase();const r=LIB.filter(x=>!ql||x[0].toLowerCase().includes(ql)||x[1].toLowerCase().includes(ql)).slice(0,40);
 let h='';if(ql&&!LIB.some(x=>x[0].toLowerCase()===ql))h+=`<button data-pick="__custom">Add “${esc(q.trim())}”<span>Custom</span></button>`;
 return h+r.map(x=>`<button data-pick="${LIB.indexOf(x)}">${esc(x[0])}<span>${x[1]} · ${x[2]}–${x[3]}</span></button>`).join('')}
function uniqueId(name){const base=slug(name),m=exMap();let id=base,n=2;while(m[id]&&m[id].name.toLowerCase()!==name.toLowerCase())id=base+'-'+(n++);return id}
function addFromPicker(name,m,lo,hi){if(st.picker&&st.picker.ctx==='swap'){const [gi,ei]=st.picker.key.split('-').map(Number),orig=pd().groups[gi][ei],s=ensure();s.swap=s.swap||{};const ex=E(name,m,lo,hi,+orig.sets||2,slug(name));s.swap[orig.id]=ex;s.names[ex.id]=name;saveS();st.picker=null;st.menu=null;toast('Swapped to '+name+' for today');render();return}const dayI=st.picker.ctx==='today'?DAYS.indexOf(st.day):st.pday,d=st.plan.days[dayI];const ex=E(name,m,lo,hi,2,uniqueId(name));
 if(st.picker.gi>=0&&d.groups[st.picker.gi])d.groups[st.picker.gi].push(ex);else d.groups.push([ex]);if(d.type==='off')d.type='other';saveP();toast(name+' added');st.picker=null;render()}
/* ---------- progress ---------- */
function allIds(){const ids=[];Object.keys(exMap()).forEach(id=>ids.push(id));Object.values(st.sessions).forEach(s=>Object.keys(s.ex||{}).forEach(id=>{if(!ids.includes(id))ids.push(id)}));return ids}
function points(id){return sorted().reverse().filter(([,s])=>s.ex&&s.ex[id]&&s.ex[id].some(full)).map(([k,s])=>{const v=s.ex[id].filter(full);const b=v.reduce((m,x)=>e1(x)>e1(m)?x:m,v[0]);return{s,e:Math.round(e1(b)),b,vol:v.reduce((a,x)=>a+x.w*x.r,0)}})}
function spark(pts,c){if(pts.length<2)return '<svg viewBox="0 0 80 30"><line x1="0" y1="15" x2="80" y2="15" stroke="#d7d9e0" stroke-dasharray="3 3"/></svg>';const v=pts.map(p=>p.e),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;const d=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*76+2).toFixed(1)},${(26-(p.e-mn)/r*22).toFixed(1)}`).join('');return `<svg viewBox="0 0 80 30" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}
const mcol=m=>({Chest:'#ef2b36',Back:'#2563ff',Shoulders:'#ff7a3d','Side delts':'#ff9f1c','Rear delts':'#ffbe0b',Biceps:'#7c4dff',Triceps:'#d14dff',Forearms:'#a98bff',Traps:'#00b7ff',Quads:'#16b65b',Hamstrings:'#0fa958',Glutes:'#00c2a8',Calves:'#4fdc8c',Abs:'#23252b','Lower back':'#6b7080'}[m]||'#6b7080');
function renderProg(){const ids=allIds();const muscles=['All',...MUSCLES.filter(m=>ids.some(id=>exMuscle(id)===m))];
 let h=`<h2>Progress</h2><p class="sub">Every lift you've logged. Tap one for the full story.</p>`;
 if(st.prog){const id=st.prog,pts=points(id),c=mcol(exMuscle(id));
  h+=`<div class="card" style="margin-top:12px"><div class="ghd"><h3>${esc(exName(id))}</h3><button class="btn sm" id="pback">All lifts</button></div><div class="sub">${esc(exMuscle(id))}</div>`;
  if(pts.length){const a=pts[0].e,b=pts[pts.length-1].e,best=pts.reduce((m,p)=>p.e>m.e?p:m,pts[0]),tv=pts.reduce((x,p)=>x+p.vol,0);
   h+=`<div class="tiles"><div class="tile"><div class="num">${b}</div><div class="sub">Est. max ${U()}</div></div><div class="tile"><div class="num ${b-a>0?'grn':b-a<0?'redt':''}">${b-a>=0?'+':''}${b-a}</div><div class="sub">Since first log</div></div><div class="tile"><div class="num">${best.b.w}×${best.b.r}</div><div class="sub">Best set · ${md(best.s.date)}</div></div><div class="tile"><div class="num">${kfmt(tv)}</div><div class="sub">Total ${U()} · ${pts.length} sessions</div></div></div>`;
   if(pts.length>1)h+=`<div class="fig" data-c="${c}"><svg id="chart" role="img" aria-label="Estimated max over time"></svg></div>`;
   h+=`<table class="hist">${pts.slice().reverse().map(({s,e})=>`<tr><td>${DN[dayIdx(s.date)]} ${md(s.date)}<div class="sub">${real(s)?esc((st.plan.days[DAYS.indexOf(s.day)]||{}).name||''):'Old split'}</div></td><td>${fmt(s.ex[id])}</td><td>${e}</td></tr>`).join('')}</table>`}
  else h+=`<p class="sub">No sets logged yet.</p>`;
  return h+`</div><p class="sub">Est. max uses your best set each session: weight × (1 + reps ÷ 30).</p>`}
 h+=`<div class="seg">${muscles.map(m=>`<button data-pf="${m}" aria-pressed="${st.pfilter===m}">${m}</button>`).join('')}</div><div class="card">`;
 const list=ids.filter(id=>st.pfilter==='All'||exMuscle(id)===st.pfilter).map(id=>({id,pts:points(id)})).sort((a,b)=>(b.pts.length?b.pts[b.pts.length-1].s.date:'')>(a.pts.length?a.pts[a.pts.length-1].s.date:'')?1:-1);
 h+=list.length?list.map(({id,pts})=>{const b=pts.length?pts[pts.length-1].e:0,a=pts.length?pts[0].e:0;return `<button class="lift" data-lift="${esc(id)}"><span><b>${esc(exName(id))}</b><span class="sub">${esc(exMuscle(id))}${pts.length>1?` · <span class="${b-a>=0?'grn':'redt'}">${b-a>=0?'+':''}${b-a}</span>`:''}</span></span>${spark(pts,mcol(exMuscle(id)))}<span class="num">${b||'–'}</span></button>`}).join(''):'<p class="sub">Nothing logged yet.</p>';
 return h+`</div>`}
function drawChart(){const s=$('chart');if(!s||!st.prog)return;const W=s.clientWidth,H=s.clientHeight,pts=points(st.prog);if(pts.length<2||!W)return;const c=s.parentNode.dataset.c||'#ef2b36';
 const l=40,r=16,t=14,b=26,v=pts.map(p=>p.e);let mn=Math.min(...v),mx=Math.max(...v);const pad=Math.max(5,(mx-mn)*.2);mn=Math.floor((mn-pad)/5)*5;mx=Math.ceil((mx+pad)/5)*5;
 const X=i=>l+(W-l-r)*(i/(pts.length-1)),Y=x=>t+(H-t-b)*(1-(x-mn)/(mx-mn));
 let o=`<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".3"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>`;
 [mn,Math.round((mn+mx)/10)*5,mx].forEach(x=>{o+=`<line x1="${l}" x2="${W-r}" y1="${Y(x)}" y2="${Y(x)}" stroke="#ececf1"/><text x="${l-8}" y="${Y(x)+4}" text-anchor="end">${x}</text>`});
 const d=pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.e)}`).join('');
 o+=`<path d="${d}L${X(pts.length-1)},${H-b}L${X(0)},${H-b}Z" fill="url(#ar)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>`;
 o+=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.e)}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?c:'#fff'}" stroke="${c}" stroke-width="2.4"/>`).join('');
 o+=`<text x="${l}" y="${H-5}">${md(pts[0].s.date)}</text><text x="${W-r}" y="${H-5}" text-anchor="end">${md(pts[pts.length-1].s.date)}</text>`;s.innerHTML=o}
/* ---------- stats ---------- */
function weekAgg(wd){let done=0,planned=0,sets=0,vol=0,prs=0,dur=0,dn=0;st.plan.days.forEach((d,i)=>{if(d.type!=='off'){planned++;if(doneOn(wd[i],DAYS[i]))done++}});
 Object.values(st.sessions).forEach(s=>{if(real(s)&&s.date>=wd[0]&&s.date<=wd[6]){const ss=sessStats(s);sets+=ss.sets;vol+=ss.vol;prs+=ss.prs.length;const el=elapsed(s);if(s.start&&s.end&&el>0){dur+=el;dn++}}});return{done,planned,sets,vol,prs,avg:dn?dur/dn:0}}
function renderStats(){const wd=weekDates(today()),w=weekAgg(wd);
 let h=`<h2>Stats</h2><p class="sub">This week · ${MON[toD(wd[0]).getMonth()]} ${toD(wd[0]).getDate()} to ${MON[toD(wd[6]).getMonth()]} ${toD(wd[6]).getDate()}</p><div class="tiles four"><div class="tile"><div class="num">${w.done}<span class="sub">/${w.planned}</span></div><div class="sub">Sessions</div></div><div class="tile"><div class="num">${w.sets}</div><div class="sub">Hard sets</div></div><div class="tile"><div class="num">${kfmt(w.vol)}</div><div class="sub">${U()} moved</div></div><div class="tile"><div class="num ${w.prs?'redt':''}">${w.prs}</div><div class="sub">PRs</div></div></div>`;
 h+=questsHTML();if(w.avg)h+=`<p class="sub">Average workout this week: <b style="color:var(--ink)">${mins(w.avg)}</b></p>`;
 const m={},planned={};Object.values(st.sessions).forEach(s=>{if(real(s)&&s.date>=wd[0]&&s.date<=wd[6])Object.entries(s.ex||{}).forEach(([id,a])=>{const k=exMuscle(id);m[k]=(m[k]||0)+a.filter(full).length})});
 st.plan.days.forEach(d=>d.groups.forEach(gr=>gr.forEach(e=>{planned[e.m]=(planned[e.m]||0)+(+e.sets||2)})));
 const keys=MUSCLES.filter(k=>planned[k]||m[k]);const max=Math.max(1,...keys.map(k=>Math.max(planned[k]||0,m[k]||0)));
 h+=`<div class="card sec"><h3>Sets by muscle</h3><p class="sub">Logged this week against what your plan calls for.</p>${keys.length?keys.map(k=>`<div class="mrow"><span>${k}</span><span class="t"><i style="width:${Math.round((m[k]||0)/max*100)}%;background:${mcol(k)}"></i></span><b>${m[k]||0}<span class="sub">/${planned[k]||0}</span></b></div>`).join(''):'<p class="sub">Add exercises to your plan to see this.</p>'}</div>`;
 const wk=[];for(let i=7;i>=0;i--){const d=toD(wd[0]);d.setDate(d.getDate()-i*7);const ws=weekDates(iso(d));wk.push({lbl:md(ws[0]),a:weekAgg(ws)})}const vmax=Math.max(1,...wk.map(x=>x.a.vol));
 h+=`<div class="card"><h3>Weekly volume</h3><p class="sub">Total ${U()} moved, last 8 weeks. This week in blue.</p><div class="vbars">${wk.map((x,i)=>`<div class="${i===7?'cur':''}"><span>${x.a.vol?kfmt(x.a.vol):''}</span><i style="height:${Math.round(x.a.vol/vmax*100)}%"></i><span>${x.lbl}</span></div>`).join('')}</div></div>`;
 let streak=0;for(let i=0;i<104;i++){const d=toD(wd[0]);d.setDate(d.getDate()-i*7);const ws=weekDates(iso(d));const any=Object.values(st.sessions).some(s=>real(s)&&s.date>=ws[0]&&s.date<=ws[6]&&Object.values(s.ex||{}).some(has));if(any)streak++;else if(i>0)break}
 h+=`<div class="card"><div class="ghd"><h3>Consistency</h3><span class="sub"><b style="color:var(--ink);font:900 22px Archivo">${streak}</b> week streak</span></div><div class="heat" style="margin-top:10px"><span></span>${DN.map(d=>`<span style="text-align:center">${d[0]}</span>`).join('')}`;
 const start=toD(wd[0]);start.setDate(start.getDate()-77);const td=today();
 for(let w2=0;w2<12;w2++){const ws=new Date(start);ws.setDate(start.getDate()+w2*7);h+=`<span>${ws.getMonth()+1}/${ws.getDate()}</span>`;
  for(let i=0;i<7;i++){const x=new Date(ws);x.setDate(ws.getDate()+i);const ds=iso(x);let bg='';Object.values(st.sessions).forEach(s=>{if(real(s)&&s.date===ds&&Object.values(s.ex||{}).some(has)){const dd=st.plan.days[DAYS.indexOf(s.day)];bg=dd?PC[colorOf(dd)][0]:'#ef2b36'}});h+=`<i class="${ds===td?'td':''}" style="${bg?'background:'+bg:''}"></i>`}}
 h+=`</div></div>`;
 const prs=allIds().map(id=>{let best=null,bd='',bb=false;Object.values(st.sessions).forEach(s=>(s.ex&&s.ex[id]||[]).forEach(x=>{if(full(x)&&(!best||e1(x)>e1(best))){best=x;bd=s.date;bb=!real(s)}}));return{id,best,bd,bb}}).filter(p=>p.best).sort((a,b)=>e1(b.best)-e1(a.best));
 const wk7=iso(new Date(Date.now()-7*864e5));
 h+=`<div class="card"><h3>PR board</h3><p class="sub">Best estimated max for every lift.</p>${prs.length?prs.map(p=>`<div class="prrow"><div><b>${esc(exName(p.id))}</b><div class="sub">${p.best.w}×${p.best.r} · ${md(p.bd)}${p.bb?' · old split':p.bd>=wk7?' · <span class="redt" style="font-weight:800">new</span>':''}</div></div><span class="num">${Math.round(e1(p.best))}</span></div>`).join(''):'<p class="sub">Log a session to start your board.</p>'}</div>`;
 return h}

 try{ws=new WebSocket(PUSH_URL.replace(/^http/,'ws')+'/crew/ws?code='+encodeURIComponent(st.set.crew.code)+'&id='+encodeURIComponent(me.id)+'&key='+encodeURIComponent(me.key))}catch(e){ws=null;return}
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==='refresh'||m.t==='kicked')syncCrew(true);

  if(m.t==='hype')hypeBurst(m.from);if(m.t==='chat')chatOnMsg(m.msg);if(m.t==='chatupd')chatOnUpd(m.msg)};
 ws.onopen=()=>{wsTry=0;sendLive()};ws.onclose=()=>{ws=null;if(!document.hidden&&crewOn())setTimeout(wsConnect,Math.min(30000,1000*2**wsTry++))};ws.onerror=()=>{}}

const LIFTS=[['incline','Incline press',/incline/i,[.4,.6,.85,1.05,1.25,1.45]],['bench','Bench press',/bench|chest press/i,[.5,.75,1,1.25,1.5,1.75]],['hack','Hack squat',/hack/i,[.75,1.1,1.5,1.85,2.2,2.6]],['legpress','Leg press',/leg press/i,[1.25,1.75,2.25,2.75,3.25,3.75]],['squat','Squat',/squat/i,[.75,1,1.25,1.5,1.75,2]],['rdl','RDL',/rdl|romanian/i,[.6,.85,1.1,1.35,1.6,1.85]],['dead','Deadlift',/deadlift/i,[1,1.25,1.5,1.85,2.2,2.5]],['ohp','Overhead press',/overhead|shoulder press|ohp|military/i,[.35,.5,.65,.8,.95,1.1]],['pull','Pulldown',/pulldown|pull-down|pull down|lat pull/i,[.5,.65,.8,.95,1.1,1.25]],['row','Row',/row/i,[.5,.7,.9,1.1,1.3,1.5]],['curl','Curl',/curl/i,[.2,.3,.4,.5,.6,.7]]];
function liftRanks(){const best={};realSessions().forEach(s=>Object.entries(s.ex).forEach(([id,a])=>{const n=exName(id);if(/leg curl|hamstring curl/i.test(n))return;const L=LIFTS.find(l=>l[2].test(n));if(!L)return;(a||[]).forEach(x=>{if(full(x)){const v=e1(x);if(!best[L[0]]||v>best[L[0]].e)best[L[0]]={e:v,w:+x.w,r:+x.r,n}}})}));
 const bw=+st.set.bw||0;return LIFTS.filter(l=>best[l[0]]).map(l=>{const b=best[l[0]],ratio=bw?b.e/bw:0,t=bw?l[3].filter(x=>ratio>=x).length:0,nx=l[3][t];return{k:l[0],name:l[1],...b,ratio,t,nextW:nx&&bw?Math.ceil(nx*bw/(1+1/30)/5)*5:0}})}
function liftRanksHTML(){const R=liftRanks(),bw=+st.set.bw;if(!R.length)return '';
 return `<div class="card"><h3>Lift ranks</h3><p class="sub">Each lift is ranked by your estimated 1-rep max compared with your bodyweight. These are general standards, so treat them as a guide.</p>${bw?'':`<div class="row2" style="margin:8px 0"><input id="bwin2" class="field" inputmode="decimal" placeholder="Bodyweight (${U()})"><button class="btn acc" id="bwsave">Save</button></div>`}
 <div class="lrgrid">${R.map(x=>{const t=x.t?TIERS[x.t-1]:null;return `<div class="lr" style="--tc:${t?t[1]:'#8c939e'}"><span class="lring">${x.t?ROMAN[x.t]:'–'}</span><b>${esc(x.name)}</b><span class="sub">${t?t[0]:bw?'Unranked':'Add bodyweight'}${bw?` · ${x.ratio.toFixed(2)}×`:''}</span><span class="sub lnext">${x.nextW?`Next: ${x.nextW}×1`:x.t>=6?'Legend':''}</span></div>`}).join('')}</div></div>`}

/* ---------- 0.13: quest chains ---------- */
function chainSteps(M){const kg=U()==='kg',big=kg?10:20,small=kg?5:10;return [[M-big,5],[M-small,3],[M,1]]}
const MILES=()=>U()==='kg'?[40,60,80,100,120,140,160,180,200,220,240,260]:[95,135,185,225,275,315,365,405,455,495,545,585,635];
function chains(){const rs=realSessions(),cnt={},bestW={};rs.forEach(s=>Object.entries(s.ex).forEach(([id,a])=>{const v=(a||[]).filter(full);if(!v.length)return;cnt[id]=(cnt[id]||0)+1;v.forEach(x=>{bestW[id]=Math.max(bestW[id]||0,+x.w)})}));
 const C=st.set.chains=st.set.chains||{};let ch=false;
 Object.keys(cnt).filter(id=>{const n=exName(id);return LIFTS.some(l=>l[0]!=='curl'&&l[2].test(n))&&!/leg curl|raise|fly|extension/i.test(n)}).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3).forEach(id=>{if(C[id])return;const M=MILES().find(m=>m>bestW[id]&&m-bestW[id]<=(U()==='kg'?40:90));if(M){C[id]={M,at:today()};ch=true}});
 const out=[];Object.entries(C).forEach(([id,c])=>{if(!cnt[id])return;const steps=chainSteps(c.M).map(([w,r])=>({w,r,done:rs.some(s=>(s.ex[id]||[]).some(x=>full(x)&&+x.w>=w&&+x.r>=r))}));out.push({id,name:exName(id),M:c.M,steps,done:steps.every(s=>s.done)})});
 out.filter(c=>c.done).forEach(c=>{const nm=`Road to ${c.M} · ${c.name}`,D=st.set.chainsDone=st.set.chainsDone||[];if(!D.includes(nm)){D.push(nm);ch=true;setTimeout(()=>{toast(`🗺️ Quest complete: ${nm}`);confetti(80);haptic('success');addBell('🗺️',`Quest complete: ${esc(nm)}`)},500)}delete C[c.id];ch=true});
 if(ch)saveSet();return out.filter(c=>!c.done)}
function chainsHTML(){if(!feat('quests'))return '';const L=chains();if(!L.length)return '';
 return `<div class="card"><div class="ghd"><h3>Quest chains</h3><span class="sub">${(st.set.chainsDone||[]).length} done</span></div>${L.map(c=>`<div class="chain"><b>🗺️ Road to ${c.M} · ${esc(c.name)}</b><div class="csteps">${c.steps.map((s,i)=>`<span class="cstep${s.done?' done':''}"><i>${s.done?'✓':i+1}</i>${s.w}×${s.r}</span>`).join('<span class="carrow">›</span>')}</div></div>`).join('')}</div>`}

/* ---------- 0.13: goals ---------- */
function goalInfo(g){const rs=realSessions(),T=g.w*(1+1/30);let cur=0,done=null;const wkBest={};
 rs.forEach(s=>(s.ex[g.ex]||[]).forEach(x=>{if(!full(x))return;const v=e1(x);cur=Math.max(cur,v);const w=weekDates(s.date)[0];wkBest[w]=Math.max(wkBest[w]||0,v);if(!done&&s.date>=g.created&&+x.w>=g.w)done=s.date}));
 const pts=Object.entries(wkBest).sort().slice(-8).map(([w,v])=>[(toD(w)-toD(today()))/(7*864e5),v]);let slope=0;
 if(pts.length>=3){const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;const num=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0),den=pts.reduce((a,p)=>a+(p[0]-mx)**2,0);slope=den?num/den:0}
 let proj=null;if(!done&&cur<T&&slope>0){proj=iso(new Date(Date.now()+Math.ceil((T-cur)/slope)*7*864e5))}else if(cur>=T&&!done)proj=today();
 return{cur,T,done,proj,pct:Math.min(100,Math.round(cur/T*100)),status:done?'done':proj?(proj<=g.date?'on':'behind'):'flat'}}
function goalsHTML(){if(!feat('goals'))return '';const G=st.set.goals||[];const fmt=d=>`${MON[toD(d).getMonth()]} ${toD(d).getDate()}`;
 return `<div class="card"><div class="ghd"><h3>Goals</h3><button class="btn sm" id="goaladd">+ Goal</button></div>${G.length?G.map((g,i)=>{const I=goalInfo(g);return `<div class="goal ${I.status}"><div class="qh"><span><b>${esc(exName(g.ex))} ${g.w} ${U()}</b> <span class="sub">by ${fmt(g.date)}</span></span><button class="gx" data-goaldel="${i}" aria-label="Remove goal">✕</button></div><i><u style="width:${I.done?100:I.pct}%"></u></i><div class="sub">${I.done?`🎉 Crushed on ${fmt(I.done)}`:I.status==='on'?`On pace · projected ${fmt(I.proj)}`:I.status==='behind'?`Behind pace · projected ${fmt(I.proj)}`:'Not enough recent data to project yet. Keep logging'}</div></div>`}).join(''):'<p class="sub">Pick a lift, a target and a date. Overload projects when you’ll hit it.</p>'}</div>`}
function goalCheck(){const G=st.set.goals||[];let ch=false;G.forEach(g=>{if(g.doneAt)return;const I=goalInfo(g);if(I.done){g.doneAt=I.done;ch=true;setTimeout(()=>{toast(`🎯 Goal crushed: ${exName(g.ex)} ${g.w}`);confetti(110);haptic('success');addBell('🎯',`Goal crushed: ${esc(exName(g.ex))} ${g.w} ${U()}`)},600)}});if(ch)saveSet()}
function goalSheet(){const rs=realSessions(),cnt={};rs.forEach(s=>Object.keys(s.ex).forEach(id=>{if((s.ex[id]||[]).some(full))cnt[id]=(cnt[id]||0)+1}));const ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);const d=new Date();d.setMonth(d.getMonth()+3);
 return `<div class="ghd"><h2>New goal</h2><button class="btn sm" id="sheetx">Cancel</button></div><label class="glbl" for="gex">LIFT</label><select id="gex" class="field">${ids.map(id=>`<option value="${esc(id)}">${esc(exName(id))}</option>`).join('')}</select><label class="glbl" for="gw" style="margin-top:10px;display:block">TARGET (${U()} for 1 rep)</label><input id="gw" class="field" inputmode="decimal" placeholder="225"><label class="glbl" for="gd" style="margin-top:10px;display:block">BY</label><input id="gd" class="field" type="date" value="${iso(d)}"><button class="btn acc wide" id="goalsave" style="margin-top:14px;min-height:52px">Set goal</button>`}

 if(b.id==='goalsave'){const ex=$('gex').value,w=parseFloat($('gw').value),dt=$('gd').value;if(!ex||!(w>0)||!dt){toast('Pick a lift, a weight and a date');return true}if(dt<=today()){toast('Pick a date in the future');return true}(st.set.goals=st.set.goals||[]).push({ex,w,date:dt,created:today()});saveSet();st.sheet=null;renderSheet();render();toast('Goal set 🎯');return true}
 if(d.banner){if(b.classList.contains('lockd')){toast('Your crew unlocks that banner at a higher level');return true}await crewCall('banner',{banner:d.banner});renderSheet();render();return true}
 return false}
/* ---------- 0.13: startup ---------- */
(function boot13(){try{if(st.plan&&(st.set.schema||0)<13){IDB.put('pre13',{at:Date.now(),data:backupData()});st.set.schema=13;saveSet()}}catch(e){}
 if(st.set.acct){setSync('ok');setTimeout(()=>syncNow(true),1200);startSyncPoll()}
 setTimeout(()=>{if(crewOn())wsConnect();updateBellDot()},1800);
 addEventListener('online',()=>{if(st.set.acct)syncNow(true);if(crewOn())wsConnect()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(ws){try{ws.close()}catch(e){}}return}if(st.set.acct)syncNow();if(crewOn()){wsConnect();setTimeout(sendLive,500)}})})();

startIconizer();boot14();loadCounter();crewLoop();if(crewOn()){saveCrewId();setTimeout(()=>syncCrew(true),2500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&crewOn())syncCrew()});
if(st.plan&&!Array.isArray(st.set.seen))checkUnlocks();
splash().then(()=>{if(st.plan&&st.set.seenVer!==VERSION){st.sheet={type:'news'};renderSheet()}else if(!weekReport()){checkUnlocks()}checkMissing().then(()=>mirrorNow())});
}
